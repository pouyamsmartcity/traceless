name: Website

# Builds the app and publishes it on GitHub Pages (https://<owner>.github.io/<repository>/) after every change on
# main. It only runs once the repository is public and Pages is set to "GitHub Actions" in the settings.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Links between the language pages, the sitemap and sharing previews use the real address.
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      # A record of exactly what was published: anyone can compare a downloaded file with these fingerprints.
      - run: (cd dist && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
